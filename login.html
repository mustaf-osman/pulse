<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nimo 提醒助手 · 登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink:    #0a0a0a;
    --ink-2:  #525252;
    --ink-3:  #8a8a8a;
    --line:   #ececec;
    --line-2: #d4d4d4;
    --bg:     #ffffff;
    --bg-soft:#fafafa;
    --green:  #22c55e;
    --green-2:#16a34a;
    --error:  #e11d48;
  }
  html, body { height: 100%; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--ink);
    overflow: hidden;
    -webkit-app-region: drag;
    user-select: none;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .layout {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    width: 100vw;
  }

  .card {
    -webkit-app-region: no-drag;
    width: 100%;
    max-width: 320px;
    padding: 0 32px;
  }

  /* Brand */
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 48px;
  }
  .brand-logo {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
  }
  .brand-logo img,
  .brand-logo svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .brand-name {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.2px;
    color: var(--ink);
  }

  /* Headline */
  .title {
    font-size: 22px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 8px;
    letter-spacing: -0.3px;
  }
  .subtitle {
    font-size: 13px;
    color: var(--ink-2);
    margin-bottom: 32px;
    line-height: 1.55;
  }

  /* Form */
  .form-group {
    margin-bottom: 14px;
    text-align: left;
  }
  .form-group label {
    display: block;
    font-size: 12px;
    color: var(--ink-2);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .form-group input {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font-size: 13.5px;
    outline: none;
    transition: border-color 0.12s;
    font-family: inherit;
  }
  .form-group input:hover { border-color: var(--line-2); }
  .form-group input:focus { border-color: var(--ink); }
  .form-group input::placeholder { color: var(--ink-3); }

  .error-msg {
    font-size: 12px;
    color: var(--error);
    margin-bottom: 10px;
    min-height: 16px;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .error-msg.visible { opacity: 1; }

  .login-btn {
    width: 100%;
    padding: 10px 12px;
    background: var(--green);
    border: 1px solid var(--green);
    border-radius: 6px;
    color: #fff;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
    margin-top: 4px;
    font-family: inherit;
  }
  .login-btn:hover { background: var(--green-2); border-color: var(--green-2); }
  .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .footer {
    margin-top: 28px;
    text-align: center;
    font-size: 11.5px;
    color: var(--ink-3);
    line-height: 1.6;
  }
  .footer a { color: var(--ink-2); text-decoration: none; }
  .footer a:hover { color: var(--ink); }

  .close-btn {
    position: fixed;
    top: 12px;
    right: 14px;
    -webkit-app-region: no-drag;
    width: 24px;
    height: 24px;
    border: none;
    background: transparent;
    border-radius: 4px;
    color: var(--ink-3);
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.12s, color 0.12s;
    z-index: 10;
  }
  .close-btn:hover { background: var(--bg-soft); color: var(--ink); }

  .version {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10.5px;
    color: var(--ink-3);
    letter-spacing: 0.2px;
  }
</style>
</head>
<body>

<button class="close-btn" onclick="window.pulseLogin.quit()" title="退出">✕</button>

<div class="layout">
  <div class="card">
    <div class="brand">
      <div class="brand-logo"><img src="./build/logo.svg" alt="Nimo 提醒助手"></div>
      <div class="brand-name">Nimo 提醒助手</div>
    </div>

    <div class="title">登录 Nimo 提醒助手</div>
    <div class="subtitle">桌面 AI 多端提醒服务。先登录账号，再开始今日提醒。</div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label>账号</label>
        <input type="text" id="username" placeholder="admin" autofocus>
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>
      <div class="error-msg" id="errorMsg"></div>
      <button type="submit" class="login-btn" id="loginBtn">登录</button>
    </form>

    <div class="footer">登录即代表同意 <a href="#">使用条款</a> 与 <a href="#">隐私政策</a></div>
  </div>
</div>

<div class="version">Nimo 提醒助手 · v0.1.6</div>

<script>
  const form = document.getElementById('loginForm')
  const usernameInput = document.getElementById('username')
  const passwordInput = document.getElementById('password')
  const errorMsg = document.getElementById('errorMsg')
  const loginBtn = document.getElementById('loginBtn')

  function showError(msg) {
    errorMsg.textContent = msg
    errorMsg.classList.add('visible')
  }

  function clearError() {
    errorMsg.textContent = ''
    errorMsg.classList.remove('visible')
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault()
    clearError()

    const username = usernameInput.value.trim()
    const password = passwordInput.value

    if (!username) { showError('请输入账号'); usernameInput.focus(); return }
    if (!password) { showError('请输入密码'); passwordInput.focus(); return }

    loginBtn.disabled = true
    loginBtn.textContent = '登录中...'

    try {
      const result = await window.pulseLogin.login(username, password)
      if (result.ok) {
        loginBtn.textContent = '登录成功'
      } else {
        showError(result.error || '账号或密码错误')
        loginBtn.disabled = false
        loginBtn.textContent = '登录'
        passwordInput.select()
      }
    } catch (err) {
      showError('登录失败：' + (err.message || '未知错误'))
      loginBtn.disabled = false
      loginBtn.textContent = '登录'
    }
  })

  usernameInput.addEventListener('input', clearError)
  passwordInput.addEventListener('input', clearError)
</script>
</body>
</html>
